services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soundprint
      POSTGRES_PASSWORD: soundprint
      POSTGRES_DB: soundprint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://soundprint:soundprint@postgres/soundprint
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
